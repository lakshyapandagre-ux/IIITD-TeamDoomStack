<!doctype html>
<html lang="en" data-theme="clean-light" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" id="app-favicon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyCampus — Campus Event Management</title>
    <meta name="description" content="Manage campus events, deadlines, tasks, and schedules in one place." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('mycampus_theme') || 'clean-light';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.setAttribute('data-mode', (t === 'clean-light' || t === 'warm-sand') ? 'light' : 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#111311] text-[#F3F0E8] antialiased selection:bg-[#C6FF3D] selection:text-[#111311] min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
